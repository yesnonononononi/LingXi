<h1>坐姿中性 · 首轮静帧验收</h1>
<p>本页只验收风格与几何。完整坐姿批次尚未完成，抱云、眨眼和肉垫特写参数待本帧确认后补齐。</p>
<p>两图画布均按 156 × 234 显示：站姿脚底与坐姿脚底在同一基线。坐姿可见高度约 164.5px。</p>
<div class="cards">
<figure><div class="stage"><img src="../../v3/front-standing.png" alt="既有站姿"><img src="sit_neutral@2x.png" alt="新增坐姿"></div><figcaption>浅底 · 站姿 / 坐姿</figcaption></figure>
<figure class="dark"><div class="stage"><img src="../../v3/front-standing.png" alt="既有站姿"><img src="sit_neutral@2x.png" alt="新增坐姿"></div><figcaption>深底 · 站姿 / 坐姿</figcaption></figure>
</div>
<p>人工复核：双腿前伸且屈膝、脚底肉垫朝前、裙摆铺开、双手落在腿前；头部保持圆润比例，配饰和尾巴保留原侧。不是把站姿纵向压缩。</p>
