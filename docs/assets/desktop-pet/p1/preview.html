<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌宠 P1 · 拆件验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efedf0;color:#493d46;font:15px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1150px;margin:32px auto;padding:24px}h1{font-size:27px;margin:0 0 6px}p{color:#786c76;margin:0 0 20px}.workspace{display:grid;grid-template-columns:minmax(300px,1fr) 300px;gap:24px}.stage{height:700px;display:flex;align-items:center;justify-content:center;border:1px solid #d8ced8;border-radius:16px;background:#f5f5f7}.stage.dark{background:#1a1a2e}canvas{width:auto;height:660px;max-width:100%;object-fit:contain}aside{padding:22px;border-radius:16px;background:#faf8fa}button,select{font:inherit;border:1px solid #cfc2cf;border-radius:8px;padding:9px 12px;background:#fff;color:inherit}button{cursor:pointer;margin:4px 2px}select{width:100%;margin:12px 0}.controls{margin:12px 0 20px}.hint{font-size:13px;color:#8a7d87}.sheet{width:100%;margin:22px 0;border-radius:12px}a{color:#557c99}#state{margin-top:14px;color:#557c99;font-size:13px}@media(max-width:760px){.workspace{grid-template-columns:1fr}.stage{height:520px}canvas{height:480px}}
</style>
<main><h1>桌宠 P1 · 六件拆分验收</h1><p>同画布 2048×3072 · 固定锚点 (1024,2908) · 用实际遮挡顺序检查静止还原与小幅摆动。</p>
<div class="workspace"><div class="stage" id="stage"><canvas id="canvas" width="2048" height="3072"></canvas></div>
<aside><b>选择部件</b><select id="part"><option value="01_tail_base">01 尾根段</option><option value="02_tail_tip">02 尾尖段</option><option value="03_ear_left">03 左耳</option><option value="04_ear_right">04 右耳</option><option value="05_ahoge">05 呆毛</option><option value="06_bow">06 头饰蝴蝶结</option></select>
<div class="controls"><button id="rest">静止重组</button><button id="reference">P0 原立绘</button><button id="animate">循环摆动</button></div>
<div class="controls"><button id="negative">偏移 -10px</button><button id="positive">偏移 +10px</button><button id="background">深浅背景</button></div>
<label><input type="checkbox" id="pivots"> 显示旋转支点</label><div id="state">加载资源中…</div>
<p class="hint">偏移作用于所选部件的 X/Y 两轴。循环摆动：双耳 ±4°、尾根 ±0.8°、尾尖 ±1°且延迟 150ms、呆毛 ±3°、蝴蝶结 ±2°。此页用于资源审阅，实际驱动仍需工程接入。</p>
<a href="qa/validation-report.json">验收数据</a> · <a href="README.md">接入说明</a></aside></div>
<img class="sheet" src="preview.png" alt="静止重组对照"><img class="sheet" src="qa/parts-light-dark.png" alt="六件独立图深浅背景"><img class="sheet" src="qa/offset-positive-10px.png" alt="六件正向偏移"><img class="sheet" src="qa/offset-negative-10px.png" alt="六件负向偏移"><img class="sheet" src="qa/rotation-check.png" alt="小角度旋转"></main>
<script>
const parts=[['01_tail_base',1320,2360],['02_tail_tip',1840,2160],['03_ear_left',484,708],['04_ear_right',1408,700],['05_ahoge',972,514],['06_bow',1588,944]];
const files=['support/underpainting.png',...parts.map(p=>p[0]+'.png'),'support/body-occluder.png','support/foreground-occluder.png','source/reference-p0-native.png'];
const assets=new Map(),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');let mode='rest',offset=0,ready=false;
function drawPart(id,time){const entry=parts.find(p=>p[0]===id);ctx.save();if(offset&&document.querySelector('#part').value===id)ctx.translate(offset,offset);if(mode==='animate'){let angle=0;if(id==='01_tail_base')angle=Math.sin(time/1100)*.8;if(id==='02_tail_tip'){const root=parts[0];ctx.translate(root[1],root[2]);ctx.rotate(Math.sin(time/1100)*.8*Math.PI/180);ctx.translate(-root[1],-root[2]);angle=Math.sin((time-150)/1100);}if(id.includes('ear'))angle=Math.sin(time/700+(id==='03_ear_left'?0:1))*4;if(id==='05_ahoge')angle=Math.sin(time/850)*3;if(id==='06_bow')angle=Math.sin((time-100)/950)*2;ctx.translate(entry[1],entry[2]);ctx.rotate(angle*Math.PI/180);ctx.translate(-entry[1],-entry[2]);}ctx.drawImage(assets.get(id+'.png'),0,0);ctx.restore();}
function draw(time){if(!ready)return;ctx.clearRect(0,0,2048,3072);ctx.imageSmoothingEnabled=true;if(mode==='reference'){ctx.drawImage(assets.get('source/reference-p0-native.png'),0,0,2048,3072);}else{ctx.drawImage(assets.get('support/underpainting.png'),0,0);for(const id of ['01_tail_base','02_tail_tip','03_ear_left','04_ear_right'])drawPart(id,time);ctx.drawImage(assets.get('support/body-occluder.png'),0,0);drawPart('05_ahoge',time);drawPart('06_bow',time);ctx.drawImage(assets.get('support/foreground-occluder.png'),0,0);}if(document.querySelector('#pivots').checked){for(const[id,x,y]of parts){ctx.strokeStyle='#db658b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.moveTo(x-22,y);ctx.lineTo(x+22,y);ctx.moveTo(x,y-22);ctx.lineTo(x,y+22);ctx.stroke();}}if(mode==='animate')requestAnimationFrame(draw);}
function update(next,value=0){mode=next;offset=value;document.querySelector('#state').textContent=next==='reference'?'P0 原立绘':next==='animate'?'按支点循环摆动':value?'所选部件 X/Y 偏移 '+value+'px':'P1 静止重组';draw(performance.now());}
document.querySelector('#rest').onclick=()=>update('rest');document.querySelector('#reference').onclick=()=>update('reference');document.querySelector('#animate').onclick=()=>{if(mode!=='animate')update('animate');};document.querySelector('#negative').onclick=()=>update('rest',-10);document.querySelector('#positive').onclick=()=>update('rest',10);document.querySelector('#background').onclick=()=>document.querySelector('#stage').classList.toggle('dark');document.querySelector('#pivots').onchange=()=>{if(mode!=='animate')draw(performance.now());};document.querySelector('#part').onchange=()=>{if(mode!=='animate')draw(performance.now());};
Promise.all(files.map(file=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{assets.set(file,image);resolve();};image.onerror=()=>reject(new Error('资源加载失败: '+file));image.src=file;}))).then(()=>{ready=true;update('rest');}).catch(error=>document.querySelector('#state').textContent=error.message);
</script></html>
