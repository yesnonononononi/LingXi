<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌宠 P0 资源验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeedf0;color:#443b40;font:15px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1050px;margin:40px auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{margin:4px 0 20px;color:#756971}.stage{height:320px;background:#f5f5f7;display:flex;justify-content:center;align-items:center;border:1px solid #ded8dd;border-radius:18px}.stage.dark{background:#1a1a2e}.stage img{height:234px;width:156px;object-fit:contain}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{font:inherit;border:1px solid #d4c7cd;border-radius:8px;background:#faf8f9;color:#443b40;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:#dce8f3;border-color:#7d9cb6}.sheet{width:100%;display:block;margin:20px 0;border-radius:12px}code{font-size:13px}
</style>
<main><h1>桌宠 · 8 档表情验收</h1><p>角色可见高度约 208px。检查眨眼、眼口可读性，以及连续切换时轮廓是否跳动。</p>
<div class="stage" id="stage"><img id="pet" src="../runtime/composites/neutral@2x.webp" alt="默认表情"></div>
<div class="controls" id="expressions"></div><div class="controls"><button id="background">切换深浅背景</button><button id="loop">连续切换 10 轮</button><button id="blink">眨眼</button></div>
<p id="status">默认 · 使用已合成完整帧。</p><img class="sheet" src="expressions-208px.png" alt="8 档表情深浅背景预览"><img class="sheet" src="faces-detail.png" alt="面部细节对比"><img class="sheet" src="palette.png" alt="材质色板">
<p>母版、贴片、身体底图和 PSD 使用同一画布与原点。贴片需搭配 <code>body-without-head</code>，完整帧可以直接显示。</p></main>
<script>
const states=[['neutral','默认'],['blink','眨眼'],['surprised','惊讶'],['sad','委屈'],['angry','生气'],['shy','害羞'],['happy','开心'],['sleepy','困倦']];
const pet=document.querySelector('#pet');let timer;let running=false;
function show(id){const state=states.find(item=>item[0]===id);pet.src=`../runtime/composites/${id}@2x.webp`;pet.alt=state[1];document.querySelector('#status').textContent=state[1]+' · 完整帧';for(const button of document.querySelectorAll('[data-expression]'))button.setAttribute('aria-pressed',button.dataset.expression===id)}
for(const [id,label] of states){const image=new Image();image.src=`../runtime/composites/${id}@2x.webp`;const button=document.createElement('button');button.textContent=label;button.dataset.expression=id;button.setAttribute('aria-pressed',id==='neutral');button.onclick=()=>{clearInterval(timer);running=false;show(id)};document.querySelector('#expressions').append(button)}
document.querySelector('#background').onclick=()=>document.querySelector('#stage').classList.toggle('dark');
document.querySelector('#loop').onclick=()=>{clearInterval(timer);running=true;let count=0;const sequence=['neutral','surprised','happy'];timer=setInterval(()=>{show(sequence[count++%3]);if(count===30){clearInterval(timer);running=false;show('neutral')}},350)};
document.querySelector('#blink').onclick=()=>{if(running)return;show('blink');setTimeout(()=>show('neutral'),180)};
</script></html>
