<!doctype html>
<html lang="zh-CN" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AetherAgent (星辰智能体) 是一款基于 Vue3, TypeScript 和 Tailwind CSS 构建的高性能 AI 交互控制台，内置 RAG 混合检索召回追踪、代码沙箱执行轨迹及智能路由面板。" />
    <title>LX</title>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('lingxi-theme');
          const isDark = saved ? saved === 'dark' : (!window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches);
          const root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.classList.toggle('light', !isDark);
          root.dataset.theme = isDark ? 'dark' : 'light';
          root.style.colorScheme = isDark ? 'dark' : 'light';

          // 字号缩放首帧镜像：真值源在后端（S2 接入），首帧拿不到，先按 localStorage 镜像写变量，
          // 否则每次启动会「小字 → 变大」闪一下。口径与 useFontScale.ts 完全一致：
          // 默认档（1）不写变量（写了会让 calc 的属性字符串形态变化，视觉基线按默认态采集），
          // 区间 [0.875, 1.5] 与 useFontScale.ts 的 MIN_FONT_SCALE / MAX_FONT_SCALE 必须同步。
          const storedRaw = localStorage.getItem('lingxi-font-scale');
          const storedScale = storedRaw === null || storedRaw.trim() === '' ? 1 : Number(storedRaw);
          const clampedScale = Number.isFinite(storedScale) ? Math.min(1.5, Math.max(0.875, storedScale)) : 1;
          if (clampedScale !== 1) root.style.setProperty('--lx-font-scale', String(clampedScale));
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="theme-ease">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
