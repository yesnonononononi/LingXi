<!doctype html>
<html lang="zh-CN" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AetherAgent (星辰智能体) 是一款基于 Vue3, TypeScript 和 Tailwind CSS 构建的高性能 AI 交互控制台，内置 RAG 混合检索召回追踪、代码沙箱执行轨迹及智能路由面板。" />
    <title>LX</title>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('lingxi-theme');
          const isDark = saved ? saved === 'dark' : (!window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches);
          const root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.classList.toggle('light', !isDark);
          root.dataset.theme = isDark ? 'dark' : 'light';
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="theme-ease">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
