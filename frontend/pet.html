<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LX 桌宠</title>
    <style>
      /*
       * 首帧就定死透明底：等 CSS 加载完再变透明会闪一下纯白/纯黑。
       * 桌宠是常驻窗口，闪一次就会被用户看见，所以这条必须内联在这里。
       */
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="pet-root"></div>
    <script type="module" src="/src/pet/main.ts"></script>
  </body>
</html>
