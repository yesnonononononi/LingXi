<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingXi 扩展包开放文档</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-table-head: #f5f6f7;
      --bg-hover: #f2f3f5;
      --bg-code: #f6f8fa;
      --border-line: #dee0e3;
      --border-soft: #ebedf0;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-muted: #8f959e;
      --feishu-blue: #3370ff;
      --feishu-blue-soft: #f0f4ff;
      --badge-green-bg: #e8f8f0;
      --badge-green-text: #008a4b;
      --badge-cyan-bg: #e6f7f7;
      --badge-cyan-text: #007a7c;
      --badge-gray-bg: #f2f3f5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* 左侧飞书开放平台风格导航树 */
    .nav-sidebar {
      width: 276px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-soft);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 12px 0 28px;
      user-select: none;
    }

    .nav-section {
      border-bottom: 1px solid var(--border-soft);
      padding: 4px 0;
    }

    .nav-section:last-child {
      border-bottom: none;
    }

    .nav-section-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
    }

    .nav-section-btn:hover {
      background: var(--bg-hover);
    }

    .nav-chevron {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      transition: transform 150ms ease;
      flex-shrink: 0;
    }

    .nav-section.is-collapsed .nav-chevron {
      transform: rotate(180deg);
    }

    .nav-section-body {
      padding: 2px 0 6px;
    }

    .nav-section.is-collapsed .nav-section-body {
      display: none;
    }

    .nav-group-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 7px 16px 7px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
    }

    .nav-group-btn:hover {
      background: var(--bg-hover);
    }

    .nav-tri {
      width: 10px;
      height: 10px;
      color: var(--text-muted);
      transition: transform 120ms ease;
      flex-shrink: 0;
    }

    .nav-group.is-open > .nav-group-btn .nav-tri {
      transform: rotate(90deg);
    }

    .nav-group-children {
      display: none;
    }

    .nav-group.is-open > .nav-group-children {
      display: block;
    }

    .nav-leaf {
      width: 100%;
      background: transparent;
      border: none;
      padding: 7px 16px 7px 36px;
      display: block;
      font-size: 13.5px;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      transition: background 120ms ease, color 120ms ease;
    }

    .nav-leaf.depth-3 {
      padding-left: 50px;
    }

    .nav-leaf:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-leaf.is-active {
      color: var(--feishu-blue);
      font-weight: 500;
    }

    /* 右侧主文档阅读区 */
    .doc-main {
      flex: 1;
      min-width: 0;
      padding: 24px 64px 88px;
      max-width: 1080px;
    }

    .breadcrumb {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .breadcrumb .sep {
      color: var(--text-muted);
    }

    .doc-title {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 600;
      color: var(--text-primary);
    }

    .doc-updated {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .doc-lead {
      font-size: 14.5px;
      color: var(--text-primary);
      margin: 0 0 28px;
    }

    h2 {
      margin: 34px 0 14px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    h3 {
      margin: 24px 0 10px;
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    p {
      margin: 8px 0 12px;
      color: var(--text-primary);
    }

    ul, ol {
      margin: 8px 0 14px;
      padding-left: 20px;
    }

    li {
      margin: 4px 0;
      color: var(--text-primary);
    }

    /* 飞书开放平台结构化表格 */
    .feishu-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 24px;
      border: 1px solid var(--border-line);
      font-size: 13.5px;
    }

    .feishu-table th,
    .feishu-table td {
      border-bottom: 1px solid var(--border-line);
      padding: 11px 16px;
      text-align: left;
      vertical-align: top;
    }

    .feishu-table th {
      background: var(--bg-table-head);
      font-weight: 500;
      color: var(--text-primary);
    }

    .feishu-table td.kv-key {
      width: 220px;
      color: var(--text-primary);
    }

    .feishu-table tr:last-child td {
      border-bottom: none;
    }

    .sub-note {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 飞书风格徽章与胶囊 */
    .badge-green {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
      font-size: 12px;
      font-weight: 500;
      margin-right: 6px;
    }

    .badge-cyan {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--badge-cyan-bg);
      color: var(--badge-cyan-text);
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 12px;
    }

    .code-inline {
      display: inline-block;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--badge-gray-bg);
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 12.5px;
      color: var(--text-primary);
    }

    .perm-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }

    .perm-key {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* 代码块 */
    .code-block {
      margin: 12px 0 22px;
      border: 1px solid var(--border-line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-code);
    }

    .code-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--bg-table-head);
      border-bottom: 1px solid var(--border-line);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .copy-btn {
      border: 1px solid var(--border-line);
      background: #ffffff;
      color: var(--text-secondary);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .copy-btn:hover {
      color: var(--feishu-blue);
      border-color: var(--feishu-blue);
    }

    pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .callout-box {
      margin: 14px 0 20px;
      padding: 12px 16px;
      border-radius: 6px;
      background: var(--feishu-blue-soft);
      border-left: 3px solid var(--feishu-blue);
      font-size: 13.5px;
      color: var(--text-primary);
    }

    @media (max-width: 900px) {
      .nav-sidebar { width: 220px; }
      .doc-main { padding: 20px 24px 64px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 左侧飞书多级文档树 -->
    <nav class="nav-sidebar" aria-label="文档目录">
      <div class="nav-section" data-section>
        <button type="button" class="nav-section-btn">
          <span>快速开始</span>
          <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6" />
          </svg>
        </button>
        <div class="nav-section-body">
          <button type="button" class="nav-leaf is-active" data-doc="load-guide">加载自定义扩展包</button>
          <button type="button" class="nav-leaf" data-doc="dir-structure">目录结构与约定</button>
          <button type="button" class="nav-leaf" data-doc="security-limits">安全边界与限制</button>
        </div>
      </div>

      <div class="nav-section" data-section>
        <button type="button" class="nav-section-btn">
          <span>核心规范</span>
          <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6" />
          </svg>
        </button>
        <div class="nav-section-body">
          <button type="button" class="nav-leaf" data-doc="manifest-spec">manifest.json 清单规范</button>
          <button type="button" class="nav-leaf" data-doc="assets-inline">静态资源引用与内联</button>
          <button type="button" class="nav-leaf" data-doc="anchor-contract">可覆盖锚点契约</button>
        </div>
      </div>

      <div class="nav-section" data-section>
        <button type="button" class="nav-section-btn">
          <span>扩展包开发</span>
          <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6" />
          </svg>
        </button>
        <div class="nav-section-body">
          <div class="nav-group is-open" data-group>
            <button type="button" class="nav-group-btn">
              <svg class="nav-tri" viewBox="0 0 12 12" fill="currentColor"><path d="M4 2l5 4-5 4V2z" /></svg>
              <span>开发前必读</span>
            </button>
            <div class="nav-group-children">
              <button type="button" class="nav-leaf depth-3" data-doc="overview">架构概述</button>
              <button type="button" class="nav-leaf depth-3" data-doc="faq">常见问题</button>
            </div>
          </div>

          <div class="nav-group is-open" data-group>
            <button type="button" class="nav-group-btn">
              <svg class="nav-tri" viewBox="0 0 12 12" fill="currentColor"><path d="M4 2l5 4-5 4V2z" /></svg>
              <span>类目开发指南</span>
            </button>
            <div class="nav-group-children">
              <button type="button" class="nav-leaf depth-3" data-doc="cat-theme">主题皮肤 (theme)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-font">文字字体 (font)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-background">主页背景 (background)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-sidebar">侧边栏 (sidebar)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-input">输入框 (input)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-motion">渲染动效 (motion)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-task-progress">任务进度 (taskProgress)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-interaction-card">互动卡片 (interactionCard)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-chat-message">消息与过程流 (chatMessage)</button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- 右侧正文容器 -->
    <main class="doc-main" id="doc-content"></main>
  </div>

  <script>
    (function () {
      var DOCS = {
        'load-guide': {
          breadcrumb: ['开放文档', '快速开始', '加载自定义扩展包'],
          title: '加载自定义扩展包',
          updated: '最后更新于 2026-11-16',
          lead: '通过本指南可在 LingXi 客户端中直接输入本机绝对路径或选择文件夹，加载并调试你编写的纯资源扩展包。',
          html: [
            '<h2>能力说明</h2>',
            '<table class="feishu-table">',
            '  <thead><tr><th colspan="2">基本</th></tr></thead>',
            '  <tbody>',
            '    <tr><td class="kv-key">入口位置</td><td>设置 &gt; 扩展包 &gt; 自定义本地扩展包目录</td></tr>',
            '    <tr><td class="kv-key">加载方式</td><td><span class="badge-green">● 多包合集目录</span><span class="badge-green">● 单包根目录</span></td></tr>',
            '    <tr><td class="kv-key">必备文件<span class="sub-note">缺一不可</span></td><td><div class="perm-item"><span class="perm-key">①</span> 扩展包清单文件 <span class="badge-cyan">manifest.json</span></div><div class="perm-item"><span class="perm-key">②</span> 样式入口文件 <span class="badge-cyan">pack.css</span></div></td></tr>',
            '    <tr><td class="kv-key">生效机制</td><td>自动按 <span class="code-inline">category</span> 归类展示，支持跨类目叠加与重启自动恢复</td></tr>',
            '  </tbody>',
            '</table>',
            '<h2>操作步骤</h2>',
            '<ol>',
            '  <li>在本地磁盘准备一个目录（例如 <span class="code-inline">D:\\my-lingxi-packs</span>），放入一个或多个扩展包文件夹。</li>',
            '  <li>打开客户端 <strong>设置 → 扩展包</strong>，在「自定义本地扩展包目录」输入框填入该绝对路径（或点击「选择文件夹」）。</li>',
            '  <li>点击「加载」，系统会扫描目录下的全部合法扩展包，并按类目归类到上方列表。</li>',
            '  <li>点进对应类目卡片，选择你的扩展包即可实时生效。修改本地 CSS 后，点击目录行右侧的「刷新」并重新点选一次即可热更新。</li>',
            '</ol>',
            '<div class="callout-box">提示：同一类目内扩展包互斥单选；不同类目（如主题 + 字体 + 背景 + 侧边栏 + 输入框）可同时叠加生效。</div>'
          ].join('')
        },
        'dir-structure': {
          breadcrumb: ['开放文档', '快速开始', '目录结构与约定'],
          title: '目录结构与约定',
          updated: '最后更新于 2026-11-16',
          lead: '扩展包采用零构建、纯静态资源目录约定，无需安装 Node 或打包工具即可直接被客户端加载。',
          html: [
            '<h2>多包合集目录（推荐）</h2>',
            '<p>将多个自定义扩展包放在同一个父目录下，输入父目录路径即可一次导入全部类目：</p>',
            '<div class="code-block"><div class="code-bar"><span>目录树</span><button type="button" class="copy-btn" data-copy>复制</button></div><pre>D:\\my-lingxi-packs\\\n├── custom-ocean-theme\\\n│   ├── manifest.json\n│   └── pack.css\n├── custom-reading-font\\\n│   ├── manifest.json\n│   ├── pack.css\n│   └── fonts\\\n│       └── reading.woff2\n└── custom-wallpaper-bg\\\n    ├── manifest.json\n    ├── pack.css\n    └── assets\\\n        └── bg.webp</pre></div>',
            '<h2>单包根目录</h2>',
            '<p>如果只调试单个扩展包，也可以直接输入包含 <span class="code-inline">manifest.json</span> 的目录本身（例如 <span class="code-inline">D:\\my-lingxi-packs\\custom-ocean-theme</span>）。</p>'
          ].join('')
        },
        'security-limits': {
          breadcrumb: ['开放文档', '快速开始', '安全边界与限制'],
          title: '安全边界与限制',
          updated: '最后更新于 2026-11-16',
          lead: '为保障桌面客户端运行安全，Electron 主进程在扫描与读取本地自定义目录时会执行严格的白名单校验。',
          html: [
            '<h2>校验规则</h2>',
            '<table class="feishu-table">',
            '  <thead><tr><th style="width:180px">校验项</th><th style="width:140px">约束</th><th>说明</th></tr></thead>',
            '  <tbody>',
            '    <tr><td>路径形式</td><td>必须为绝对路径</td><td>拒绝相对路径与包含 <span class="code-inline">..</span> 的路径穿越。</td></tr>',
            '    <tr><td>文件类型白名单</td><td>仅静态资源</td><td>仅允许 <span class="code-inline">.json</span>、<span class="code-inline">.css</span>、字体（<span class="code-inline">.woff2/.woff/.ttf</span>）与图片，拒绝执行任何 <span class="code-inline">.js/.mjs</span> 脚本。</td></tr>',

            '</table>'
          ].join('')

        'manifest-spec': {
          breadcrumb: ['开放文档', '核心规范', 'manifest.json 清单规范'],
          title: 'manifest.json 清单规范',
          updated: '最后更新于 2026-11-16',
          lead: '每个扩展包根目录必须包含 manifest.json，用于声明扩展包元信息、所属类目以及兼容的宿主 API 版本。',
          html: [
            '<h2>基本</h2>',
            '<table class="feishu-table">',
            '  <tbody>',
            '    <tr><td class="kv-key">文件位置</td><td>扩展包根目录 <span class="badge-cyan">manifest.json</span></td></tr>',
            '    <tr><td class="kv-key">字符编码</td><td>UTF-8（无 BOM）</td></tr>',
            '    <tr><td class="kv-key">兼容声明</td><td><span class="badge-green">● hostApiVersion: "1"</span></td></tr>',
            '  </tbody>',
            '</table>',
            '<h2>字段说明</h2>',
            '<table class="feishu-table">',
            '  <thead><tr><th style="width:150px">名称</th><th style="width:100px">类型</th><th style="width:70px">必填</th><th>描述</th></tr></thead>',
            '  <tbody>',
            '    <tr><td>id</td><td>string</td><td>是</td><td>唯一标识。<br><span class="sub-note">示例值："custom-ocean-theme"</span></td></tr>',
            '    <tr><td>category</td><td>string</td><td>是</td><td>所属类目：<span class="badge-cyan">theme</span> <span class="badge-cyan">font</span> <span class="badge-cyan">background</span> <span class="badge-cyan">sidebar</span> <span class="badge-cyan">input</span> <span class="badge-cyan">motion</span> <span class="badge-cyan">taskProgress</span> <span class="badge-cyan">interactionCard</span> <span class="badge-cyan">chatMessage</span><br><span class="sub-note">区分大小写。历史别名 component 仍能加载，但已不属于官方类目，新包不要使用。</span></td></tr>',

        'cat-chat-message': {

          html: [

            '<table class="feishu-table">',
            '  <thead><tr><th style="width:170px">chatMessageTab</th><th style="width:180px">对应范围</th><th>可覆盖锚点 / Slot</th></tr></thead>',

            '    <tr><td><span class="badge-cyan">processThought</span></td><td>过程区 · 思考步骤</td><td><span class="code-inline">[data-slot="process-thought"]</span> / <span class="code-inline">slots.chatMessage.processThought</span></td></tr>',
            '    <tr><td><span class="badge-cyan">processTool</span></td><td>过程区 · 工具调用</td><td><span class="code-inline">[data-slot="process-tool"]</span> / <span class="code-inline">slots.chatMessage.processTool</span></td></tr>',

            '  </tbody>',
            '</table>',
            '<h2>方式一：外部纯资源包（manifest.json + pack.css）</h2>',
            '<p>本地自定义目录与 GitHub 远程扩展包只加载纯 CSS。推荐优先使用 <span class="code-inline">data-slot</span> 契约锚点与 <span class="code-inline">var(--lx-*)</span> 语义令牌，这样你的终端/线框样式能自动跟随任意主题皮肤、侧边栏与背景包联动换肤。</p>',
            '<div class="code-block"><div class="code-bar"><span>manifest.json</span><button type="button" class="copy-btn" data-copy>复制</button></div><pre>{\n  "id": "my-terminal-tool",\n  "category": "chatMessage",\n  "chatMessageTab": "processTool",\n  "name": "我的终端工具行",\n  "description": "将工具调用行改造为等宽命令行样式",\n  "version": "1.0.0",\n  "hostApiVersion": "1",\n  "entryCss": "pack.css"\n}</pre></div>',
            '<div class="code-block"><div class="code-bar"><span>pack.css（纯 CSS 极限示例）</span><button type="button" class="copy-btn" data-copy>复制</button></div><pre>/* 1. 用户气泡：直角线框 + 左侧强调轨 */\n[data-slot="user-message-bubble"] {\n  border-radius: 4px !important;\n  border: 1px solid var(--lx-border-default) !important;\n  border-left: 3px solid var(--lx-accent) !important;\n  background: var(--lx-surface-sunken) !important;\n  font-family: var(--font-lx-code, ui-monospace, monospace);\n}\n\n/* 2. 助手正文：左侧遥测轨 + 等宽排版 */\n[data-slot="message-item"] [data-slot="assistant-body"] {\n  padding: 10px 14px;\n  border: 1px solid var(--lx-border-subtle);\n  border-left: 2px solid var(--lx-accent);\n  background: var(--lx-surface);\n  font-family: var(--font-lx-code, ui-monospace, monospace);\n}\n\n/* 3. 过程区（思考 / 工具 / 子代理） */\n[data-slot="process-thought"] {\n  border: 1px dashed var(--lx-border-default);\n  border-left: 2px solid var(--lx-info);\n  padding: 6px 10px;\n  background: var(--lx-surface-sunken);\n}\n[data-slot="process-tool"] {\n  border: 1px solid var(--lx-border-subtle);\n  border-left: 2px solid var(--lx-border-default);\n  padding: 3px 8px;\n  background: var(--lx-surface-sunken);\n  font-family: var(--font-lx-code, ui-monospace, monospace);\n}\n[data-slot="process-tool"]:hover {\n  border-left-color: var(--lx-accent);\n}\n[data-slot="process-sub-agent"] {\n  border-radius: 4px !important;\n  border-left: 3px solid var(--lx-accent) !important;\n}</pre></div>',
            '<h2>方式二：内置 Slot 极限扩展（Vue 组件重构）</h2>',
            '<p>当纯 CSS 无法满足结构重构（例如将对话改成带 <span class="code-inline">$ user@lingxi</span> 提示符、<span class="code-inline">[AGENT // STDOUT]</span> 状态灯、<span class="code-inline">[EXEC/OK/ERR]</span> 退出码的完整终端 TUI）时，可在 <span class="code-inline">frontend/src/packs/builtin/</span> 下开发内置包并注册到 <span class="code-inline">packRegistry.ts</span>：</p>',
            '<table class="feishu-table">',
            '  <thead><tr><th style="width:240px">Slot 字段</th><th style="width:230px">Props 契约（types/chatMessageSlots.ts）</th><th>职责说明</th></tr></thead>',
            '  <tbody>',
            '    <tr><td><span class="code-inline">slots.chatMessage.userBody</span></td><td><span class="code-inline">ChatMessageUserBodySlotProps</span></td><td>替换用户消息气泡，自带复制、编辑重发、图片/文档预览回调</td></tr>',
            '    <tr><td><span class="code-inline">slots.chatMessage.body</span></td><td><span class="code-inline">ChatMessageBodySlotProps</span></td><td>替换助手流式正文渲染（可复用 <span class="code-inline">MarkdownRenderer</span> 或自定义渲染）</td></tr>',
            '    <tr><td><span class="code-inline">slots.chatMessage.actions</span></td><td><span class="code-inline">ChatMessageActionsSlotProps</span></td><td>替换助手底部操作栏与 token/耗时遥测条</td></tr>',
            '    <tr><td><span class="code-inline">slots.chatMessage.messageItem</span></td><td><span class="code-inline">ChatMessageItemSlotProps</span></td><td>替换整行 <span class="code-inline">ChatMessageItem</span>（完全接管整条消息布局）</td></tr>',
            '    <tr><td><span class="code-inline">slots.chatMessage.processThought</span></td><td><span class="code-inline">ProcessThoughtSlotProps</span></td><td>替换过程区单个思考步骤，含 <span class="code-inline">scroll</span> 贴底控制句柄</td></tr>',
            '    <tr><td><span class="code-inline">slots.chatMessage.processTool</span></td><td><span class="code-inline">ProcessToolSlotProps</span></td><td>替换过程区工具调用行，含 <span class="code-inline">fileEdits</span> 与文件预览上下文</td></tr>',
            '    <tr><td><span class="code-inline">slots.chatMessage.processSubAgent</span></td><td><span class="code-inline">ProcessSubAgentSlotProps</span></td><td>替换过程区子代理协同条，含 <span class="code-inline">subSessions</span> 与跳转回调</td></tr>',
            '  </tbody>',
            '</table>',
            '<h2>Slot Props 字段速查（不看源码也能写）</h2>',
            '<p>下表列出 5 个插槽实际下发的字段。字段名与类型以 <span class="code-inline">frontend/src/types/chatMessageSlots.ts</span> 为唯一真源；<span class="code-inline">?</span> 表示可选（宿主可能不下发）。</p>',
            '<table class="feishu-table">',
            '  <thead><tr><th style="width:180px">接口</th><th>字段</th></tr></thead>',
            '  <tbody>',
            '    <tr><td><span class="code-inline">ChatMessageUserBodySlotProps</span></td><td><span class="code-inline">message</span>, <span class="code-inline">isDark</span>, <span class="code-inline">parsedText</span>（已解析的纯文本）, <span class="code-inline">documents[]</span>, <span class="code-inline">imageUrls[]</span>, <span class="code-inline">displayTime</span>, <span class="code-inline">copied</span>, <span class="code-inline">canResend</span>, <span class="code-inline">resendTitle</span>, 回调 <span class="code-inline">copyContent / onResendUnsent / onEditResend / onPreviewImage(url, index) / onPreviewDocument(doc)</span></td></tr>',
            '    <tr><td><span class="code-inline">ChatMessageBodySlotProps</span></td><td><span class="code-inline">message</span>, <span class="code-inline">isDark</span>, <span class="code-inline">isThinking</span>（= <span class="code-inline">isThinking &amp;&amp; !isExploring</span>，与主流程同源）</td></tr>',
            '    <tr><td><span class="code-inline">ChatMessageActionsSlotProps</span></td><td><span class="code-inline">message</span>, <span class="code-inline">isDark</span>, <span class="code-inline">isMessageCompleted</span>, <span class="code-inline">execStatusMeta</span>(可 null), <span class="code-inline">showExecutionMeta</span>, <span class="code-inline">tokenUsage</span>(可 null), <span class="code-inline">turn</span>(可 null), <span class="code-inline">displayDuration</span>, <span class="code-inline">displayTime</span>, <span class="code-inline">copied</span>, 回调 <span class="code-inline">copyContent() / copyText(text)</span></td></tr>',
            '    <tr><td><span class="code-inline">ChatMessageItemSlotProps</span></td><td><span class="code-inline">message</span>, 可选 <span class="code-inline">taskRecipientName?</span>, <span class="code-inline">subSessions?</span>, <span class="code-inline">sessionId?</span>, <span class="code-inline">isDark?</span>, <span class="code-inline">turn?</span>, <span class="code-inline">isGroupTail?</span>, <span class="code-inline">isLastAssistant?</span>, <span class="code-inline">isSending?</span>, <span class="code-inline">canResend?</span>, <span class="code-inline">dockPendingInteractionCards?</span>, 回调 <span class="code-inline">onSelectSubSession(id) / onResendUnsent(messageId) / onEditResend(message)</span></td></tr>',
            '    <tr><td><span class="code-inline">ProcessThoughtSlotProps</span></td><td><span class="code-inline">item</span>（<span class="code-inline">item.step</span> 即思考步骤）, <span class="code-inline">isDark</span>, <span class="code-inline">isRunningTurn</span>, <span class="code-inline">isMessageComplete?</span>, <span class="code-inline">messageIsSuspended</span>, <span class="code-inline">scroll</span>（<span class="code-inline">setBoxRef / handleScroll / isFollowing / scrollToBottom</span>，贴底跟随必须靠它）</td></tr>',

            '</table>',
            '<h2>本地纯资源包：目录结构与 manifest 字段</h2>',
            '<div class="code-block"><div class="code-bar"><span>目录结构（放在扩展包根目录下，目录名必须等于 id）</span><button type="button" class="copy-btn" data-copy>复制</button></div><pre>packs/\n  my-terminal-tool/\n    manifest.json\n    pack.css</pre></div>',

            '  <thead><tr><th style="width:180px">字段</th><th style="width:90px">必填</th><th>说明</th></tr></thead>',
            '  <tbody>',
            '    <tr><td><span class="code-inline">id</span></td><td>是</td><td>必须与目录名一致，否则被判为无效包。</td></tr>',
            '    <tr><td><span class="code-inline">category</span></td><td>是</td><td>本类目填 <span class="code-inline">chatMessage</span>（区分大小写）。</td></tr>',
            '    <tr><td><span class="code-inline">chatMessageTab</span></td><td>是</td><td>五个值之一，决定挂在哪个子 Tab 下并可独立叠加。</td></tr>',
            '    <tr><td><span class="code-inline">name</span> / <span class="code-inline">description</span> / <span class="code-inline">version</span></td><td>是</td><td>设置页卡片展示用。</td></tr>',
            '    <tr><td><span class="code-inline">hostApiVersion</span></td><td>是</td><td>当前固定 <span class="code-inline">"1"</span>。</td></tr>',
            '    <tr><td><span class="code-inline">entryCss</span></td><td>否</td><td>样式入口，默认 <span class="code-inline">pack.css</span>；写别的文件名要同时把该文件放进目录。</td></tr>',
            '    <tr><td><span class="code-inline">files</span></td><td>否</td><td>声明目录内文件清单，默认 <span class="code-inline">["manifest.json","pack.css"]</span>。</td></tr>',
            '    <tr><td><span class="code-inline">preview</span></td><td>否</td><td><span class="code-inline">{canvas, surface, accent, text}</span> 四色，用于设置页缩略图。</td></tr>',
            '  </tbody>',
            '</table>',
            '<div class="callout-warn"><strong>两个易错点：</strong>① 本地/远程包<strong>只加载 CSS</strong>，不能带 JS——需要结构重构就只能走「方式二」的内置 Slot 组件；② CSS 里引用的相对资源（图片、字体）会在加载时被内联成 data URL，因此大图会让整包变慢，建议 <span class="code-inline">&lt; 200KB</span>。</div>',
            '<div class="callout-warn"><strong>SFC 编译规范提醒：</strong>在 <span class="code-inline">.vue</span> 组件的 <span class="code-inline">&lt;script setup lang="ts"&gt;</span> 中，请使用<strong>内联字面量</strong>书写 <span class="code-inline">defineProps&lt;{ ... }&gt;()</span>（不要直接写 <span class="code-inline">defineProps&lt;ImportedInterface&gt;()</span>），避免 <span class="code-inline">@vue/compiler-sfc</span> 在 Vite 开发态因跨文件深层类型引用而报 <span class="code-inline">Unresolvable type reference</span>。</div>',
            '<div class="code-block"><div class="code-bar"><span>src/packs/builtin/myTerminalTool.ts</span><button type="button" class="copy-btn" data-copy>复制</button></div><pre>import type {OfficialPackDefinition} from \'../types\';\nimport TerminalTuiToolCall from \'./TerminalTuiToolCall.vue\';\n\nexport const myTerminalToolPack: OfficialPackDefinition = {\n  id: \'my-terminal-tool\',\n  slots: {\n    chatMessage: {\n      processTool: TerminalTuiToolCall,\n    },\n  },\n};</pre></div>'
          ].join('')
        }
      };

      var contentEl = document.getElementById('doc-content');
      var leafButtons = Array.prototype.slice.call(document.querySelectorAll('.nav-leaf[data-doc]'));

      function renderDoc(docId) {
        var doc = DOCS[docId] || DOCS['load-guide'];
        var crumbs = doc.breadcrumb.map(function (item, idx) {
          return idx === 0 ? '<span>' + item + '</span>' : '<span class="sep">&gt;</span><span>' + item + '</span>';
        }).join('');

        contentEl.innerHTML =
          '<div class="breadcrumb">' + crumbs + '</div>' +
          '<h1 class="doc-title">' + doc.title + '</h1>' +
          '<div class="doc-updated">' + doc.updated + '</div>' +
          '<p class="doc-lead">' + doc.lead + '</p>' +
          doc.html;

        leafButtons.forEach(function (btn) {
          btn.classList.toggle('is-active', btn.getAttribute('data-doc') === docId);
        });

        var copyButtons = contentEl.querySelectorAll('[data-copy]');
        copyButtons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            var block = btn.closest('.code-block');
            var pre = block ? block.querySelector('pre') : null;
            if (!pre) return;
            navigator.clipboard.writeText(pre.textContent || '').then(function () {
              btn.textContent = '已复制';
              setTimeout(function () { btn.textContent = '复制'; }, 1200);
            });
          });
        });

        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      document.querySelectorAll('[data-section] > .nav-section-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          btn.parentElement.classList.toggle('is-collapsed');
        });
      });

      document.querySelectorAll('[data-group] > .nav-group-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          btn.parentElement.classList.toggle('is-open');
        });
      });

      leafButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          renderDoc(btn.getAttribute('data-doc'));
        });
      });

      renderDoc('load-guide');
    })();
  </script>
</body>
</html>
