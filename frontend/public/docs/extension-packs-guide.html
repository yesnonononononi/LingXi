<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingXi 扩展包开放文档</title>
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-table-head: #f5f6f7;
      --bg-hover: #f2f3f5;
      --bg-code: #f6f8fa;
      --border-line: #dee0e3;
      --border-soft: #ebedf0;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-muted: #8f959e;
      --feishu-blue: #3370ff;
      --feishu-blue-soft: #f0f4ff;
      --badge-green-bg: #e8f8f0;
      --badge-green-text: #008a4b;
      --badge-cyan-bg: #e6f7f7;
      --badge-cyan-text: #007a7c;
      --badge-gray-bg: #f2f3f5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* 左侧飞书开放平台风格导航树 */
    .nav-sidebar {
      width: 276px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-soft);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 12px 0 28px;
      user-select: none;
    }

    .nav-section {
      border-bottom: 1px solid var(--border-soft);
      padding: 4px 0;
    }

    .nav-section:last-child {
      border-bottom: none;
    }

    .nav-section-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
    }

    .nav-section-btn:hover {
      background: var(--bg-hover);
    }

    .nav-chevron {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      transition: transform 150ms ease;
      flex-shrink: 0;
    }

    .nav-section.is-collapsed .nav-chevron {
      transform: rotate(180deg);
    }

    .nav-section-body {
      padding: 2px 0 6px;
    }

    .nav-section.is-collapsed .nav-section-body {
      display: none;
    }

    .nav-group-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 7px 16px 7px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
    }

    .nav-group-btn:hover {
      background: var(--bg-hover);
    }

    .nav-tri {
      width: 10px;
      height: 10px;
      color: var(--text-muted);
      transition: transform 120ms ease;
      flex-shrink: 0;
    }

    .nav-group.is-open > .nav-group-btn .nav-tri {
      transform: rotate(90deg);
    }

    .nav-group-children {
      display: none;
    }

    .nav-group.is-open > .nav-group-children {
      display: block;
    }

    .nav-leaf {
      width: 100%;
      background: transparent;
      border: none;
      padding: 7px 16px 7px 36px;
      display: block;
      font-size: 13.5px;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      transition: background 120ms ease, color 120ms ease;
    }

    .nav-leaf.depth-3 {
      padding-left: 50px;
    }

    .nav-leaf:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-leaf.is-active {
      color: var(--feishu-blue);
      font-weight: 500;
    }

    /* 右侧主文档阅读区 */
    .doc-main {
      flex: 1;
      min-width: 0;
      padding: 24px 64px 88px;
      max-width: 1080px;
    }

    .breadcrumb {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .breadcrumb .sep {
      color: var(--text-muted);
    }

    .doc-title {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 600;
      color: var(--text-primary);
    }

    .doc-updated {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .doc-lead {
      font-size: 14.5px;
      color: var(--text-primary);
      margin: 0 0 28px;
    }

    h2 {
      margin: 34px 0 14px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    h3 {
      margin: 24px 0 10px;
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    p {
      margin: 8px 0 12px;
      color: var(--text-primary);
    }

    ul, ol {
      margin: 8px 0 14px;
      padding-left: 20px;
    }

    li {
      margin: 4px 0;
      color: var(--text-primary);
    }

    /* 飞书开放平台结构化表格 */
    .feishu-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 24px;
      border: 1px solid var(--border-line);
      font-size: 13.5px;
    }

    .feishu-table th,
    .feishu-table td {
      border-bottom: 1px solid var(--border-line);
      padding: 11px 16px;
      text-align: left;
      vertical-align: top;
    }

    .feishu-table th {
      background: var(--bg-table-head);
      font-weight: 500;
      color: var(--text-primary);
    }

    .feishu-table td.kv-key {
      width: 220px;
      color: var(--text-primary);
    }

    .feishu-table tr:last-child td {
      border-bottom: none;
    }

    .sub-note {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 飞书风格徽章与胶囊 */
    .badge-green {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
      font-size: 12px;
      font-weight: 500;
      margin-right: 6px;
    }

    .badge-cyan {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--badge-cyan-bg);
      color: var(--badge-cyan-text);
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 12px;
    }

    .code-inline {
      display: inline-block;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--badge-gray-bg);
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 12.5px;
      color: var(--text-primary);
    }

    .perm-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }

    .perm-key {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* 代码块 */
    .code-block {
      margin: 12px 0 22px;
      border: 1px solid var(--border-line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-code);
    }

    .code-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--bg-table-head);
      border-bottom: 1px solid var(--border-line);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .copy-btn {
      border: 1px solid var(--border-line);
      background: #ffffff;
      color: var(--text-secondary);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .copy-btn:hover {
      color: var(--feishu-blue);
      border-color: var(--feishu-blue);
    }

    pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .callout-box {
      margin: 14px 0 20px;
      padding: 12px 16px;
      border-radius: 6px;
      background: var(--feishu-blue-soft);
      border-left: 3px solid var(--feishu-blue);
      font-size: 13.5px;
      color: var(--text-primary);
    }

    @media (max-width: 900px) {
      .nav-sidebar { width: 220px; }
      .doc-main { padding: 20px 24px 64px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 左侧飞书多级文档树 -->
    <nav class="nav-sidebar" aria-label="文档目录">
      <div class="nav-section" data-section>
        <button type="button" class="nav-section-btn">
          <span>快速开始</span>
          <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6" />
          </svg>
        </button>
        <div class="nav-section-body">
          <button type="button" class="nav-leaf is-active" data-doc="load-guide">加载自定义扩展包</button>
          <button type="button" class="nav-leaf" data-doc="dir-structure">目录结构与约定</button>
          <button type="button" class="nav-leaf" data-doc="security-limits">安全边界与限制</button>
        </div>
      </div>

      <div class="nav-section" data-section>
        <button type="button" class="nav-section-btn">
          <span>核心规范</span>
          <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6" />
          </svg>
        </button>
        <div class="nav-section-body">
          <button type="button" class="nav-leaf" data-doc="manifest-spec">manifest.json 清单规范</button>
          <button type="button" class="nav-leaf" data-doc="assets-inline">静态资源引用与内联</button>
        </div>
      </div>

      <div class="nav-section" data-section>
        <button type="button" class="nav-section-btn">
          <span>扩展包开发</span>
          <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6" />
          </svg>
        </button>
        <div class="nav-section-body">
          <div class="nav-group is-open" data-group>
            <button type="button" class="nav-group-btn">
              <svg class="nav-tri" viewBox="0 0 12 12" fill="currentColor"><path d="M4 2l5 4-5 4V2z" /></svg>
              <span>开发前必读</span>
            </button>
            <div class="nav-group-children">
              <button type="button" class="nav-leaf depth-3" data-doc="overview">架构概述</button>
              <button type="button" class="nav-leaf depth-3" data-doc="faq">常见问题</button>
            </div>
          </div>

          <div class="nav-group is-open" data-group>
            <button type="button" class="nav-group-btn">
              <svg class="nav-tri" viewBox="0 0 12 12" fill="currentColor"><path d="M4 2l5 4-5 4V2z" /></svg>
              <span>类目开发指南</span>
            </button>
            <div class="nav-group-children">
              <button type="button" class="nav-leaf depth-3" data-doc="cat-theme">主题皮肤 (theme)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-font">文字字体 (font)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-background">主页背景 (background)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-sidebar">侧边栏 (sidebar)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-input">输入框 (input)</button>
              <button type="button" class="nav-leaf depth-3" data-doc="cat-component">组件与动效 (component)</button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- 右侧正文容器 -->
    <main class="doc-main" id="doc-content"></main>
  </div>

  <script>
    (function () {
      var DOCS = {
        'load-guide': {
          breadcrumb: ['开放文档', '快速开始', '加载自定义扩展包'],
          title: '加载自定义扩展包',
          updated: '最后更新于 2026-11-16',
          lead: '通过本指南可在 LingXi 客户端中直接输入本机绝对路径或选择文件夹，加载并调试你编写的纯资源扩展包。',
          html: [
            '<h2>能力说明</h2>',
            '<table class="feishu-table">',

            '    <tr><td class="kv-key">加载方式</td><td><span class="badge-green">● 多包合集目录</span><span class="badge-green">● 单包根目录</span></td></tr>',
            '    <tr><td class="kv-key">必备文件<span class="sub-note">缺一不可</span></td><td><div class="perm-item"><span class="perm-key">①</span> 扩展包清单文件 <span class="badge-cyan">manifest.json</span></div><div class="perm-item"><span class="perm-key">②</span> 样式入口文件 <span class="badge-cyan">pack.css</span></div></td></tr>',

            '<h2>操作步骤</h2>',

            '  <li>打开客户端 <strong>设置 → 扩展包</strong>，在「自定义本地扩展包目录」输入框填入该绝对路径（或点击「选择文件夹」）。</li>',

            '</ol>',
            '<div class="callout-box">提示：同一类目内扩展包互斥单选；不同类目（如主题 + 字体 + 背景 + 侧边栏 + 输入框）可同时叠加生效。</div>'
          ].join('')
        },
        'dir-structure': {
          breadcrumb: ['开放文档', '快速开始', '目录结构与约定'],
          title: '目录结构与约定',
          updated: '最后更新于 2026-11-16',
          lead: '扩展包采用零构建、纯静态资源目录约定，无需安装 Node 或打包工具即可直接被客户端加载。',
          html: [
            '<h2>多包合集目录（推荐）</h2>',
            '<p>将多个自定义扩展包放在同一个父目录下，输入父目录路径即可一次导入全部类目：</p>',
            '<div class="code-block"><div class="code-bar"><span>目录树</span><button type="button" class="copy-btn" data-copy>复制</button></div><pre>D:\\my-lingxi-packs\\\n├── custom-ocean-theme\\\n│   ├── manifest.json\n│   └── pack.css\n├── custom-reading-font\\\n│   ├── manifest.json\n│   ├── pack.css\n│   └── fonts\\\n│       └── reading.woff2\n└── custom-wallpaper-bg\\\n    ├── manifest.json\n    ├── pack.css\n    └── assets\\\n        └── bg.webp</pre></div>',
            '<h2>单包根目录</h2>',
            '<p>如果只调试单个扩展包，也可以直接输入包含 <span class="code-inline">manifest.json</span> 的目录本身（例如 <span class="code-inline">D:\\my-lingxi-packs\\custom-ocean-theme</span>）。</p>'
          ].join('')
        },
        'security-limits': {
          breadcrumb: ['开放文档', '快速开始', '安全边界与限制'],
          title: '安全边界与限制',
          updated: '最后更新于 2026-11-16',
          lead: '为保障桌面客户端运行安全，Electron 主进程在扫描与读取本地自定义目录时会执行严格的白名单校验。',
          html: [
            '<h2>校验规则</h2>',
            '<table class="feishu-table">',
            '  <thead><tr><th style="width:180px">校验项</th><th style="width:140px">约束</th><th>说明</th></tr></thead>',
            '  <tbody>',
            '    <tr><td>路径形式</td><td>必须为绝对路径</td><td>拒绝相对路径与包含 <span class="code-inline">..</span> 的路径穿越。</td></tr>',

        'manifest-spec': {
          breadcrumb: ['开放文档', '核心规范', 'manifest.json 清单规范'],
          title: 'manifest.json 清单规范',
          updated: '最后更新于 2026-11-16',

            '<table class="feishu-table">',

            '    <tr><td class="kv-key">兼容声明</td><td><span class="badge-green">● hostApiVersion: "1"</span></td></tr>',
            '  </tbody>',
            '</table>',
            '<h2>字段说明</h2>',
            '<table class="feishu-table">',

            '    <tr><td>id</td><td>string</td><td>是</td><td>唯一标识。<br><span class="sub-note">示例值："custom-ocean-theme"</span></td></tr>',
            '    <tr><td>category</td><td>string</td><td>是</td><td>所属类目：<span class="badge-cyan">theme</span> <span class="badge-cyan">font</span> <span class="badge-cyan">background</span> <span class="badge-cyan">sidebar</span> <span class="badge-cyan">input</span> <span class="badge-cyan">component</span></td></tr>',
            '    <tr><td>name</td><td>string</td><td>是</td><td>设置页卡片展示名称。</td></tr>',

            '    <tr><td>version</td><td>string</td><td>否</td><td>语义化版本号，默认 <span class="code-inline">"1.0.0"</span>。</td></tr>',
            '    <tr><td>description</td><td>string</td><td>否</td><td>扩展包简要描述。</td></tr>',

      var contentEl = document.getElementById('doc-content');
      var leafButtons = Array.prototype.slice.call(document.querySelectorAll('.nav-leaf[data-doc]'));

      function renderDoc(docId) {
        var doc = DOCS[docId] || DOCS['load-guide'];
        var crumbs = doc.breadcrumb.map(function (item, idx) {
          return idx === 0 ? '<span>' + item + '</span>' : '<span class="sep">&gt;</span><span>' + item + '</span>';
        }).join('');

        contentEl.innerHTML =
          '<div class="breadcrumb">' + crumbs + '</div>' +
          '<h1 class="doc-title">' + doc.title + '</h1>' +
          '<div class="doc-updated">' + doc.updated + '</div>' +
          '<p class="doc-lead">' + doc.lead + '</p>' +
          doc.html;

        leafButtons.forEach(function (btn) {
          btn.classList.toggle('is-active', btn.getAttribute('data-doc') === docId);
        });

        var copyButtons = contentEl.querySelectorAll('[data-copy]');
        copyButtons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            var block = btn.closest('.code-block');
            var pre = block ? block.querySelector('pre') : null;
            if (!pre) return;
            navigator.clipboard.writeText(pre.textContent || '').then(function () {
              btn.textContent = '已复制';
              setTimeout(function () { btn.textContent = '复制'; }, 1200);
            });
          });
        });

        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      document.querySelectorAll('[data-section] > .nav-section-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          btn.parentElement.classList.toggle('is-collapsed');
        });
      });

      document.querySelectorAll('[data-group] > .nav-group-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          btn.parentElement.classList.toggle('is-open');
        });
      });

      leafButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          renderDoc(btn.getAttribute('data-doc'));
        });
      });

      renderDoc('load-guide');
    })();
  </script>
