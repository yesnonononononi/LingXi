name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# 同一分支/PR 重复触发时，取消进行中的旧任务，避免浪费 Actions 额度
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (npm ci + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 安装版不展示桌宠（用户硬约束 #3）的 CI 侧保障：
      # 只在本机跑 gate:pet:not-shipped 不够 —— 别人一次构建就可能把桌宠入口带进安装包。
      # 这一步读的是刚构建出来的 dist，顺序必须紧跟 build 之后（否则等于用旧产物自证）。
      - name: 校验安装版不含桌宠入口
        run: node scripts/check-pet-not-shipped.mjs
