name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      # 桌宠美术资产的**全部**批次都住在 docs/assets/desktop-pet/
      #（v1–v4 / p1 / companion / poses/{sit,lie,sleep,walk,run,…}），而本 job 的每一步都在读它：
      #   · gate:pet              读 v3 母版 PNG、p1 分层母版与掩膜做像素级 C2/C3 校验
      #   · test:pet              读 poses/** 批次清单与帧、v4 expr，以及 .gitignore 的 desktop-pet 例外规则
      #   · check-pet-not-shipped 验的是「这些资产没有被打进安装包产物」
      # 缺这一条就会出现「只改资产 ⇒ 整套桌宠门禁一条不跑」的缝（a33afaf9 新增 poses/run 29 个文件即如此）。
      # 一条前缀即可覆盖所有批次：不需要逐批列举，将来新增批次也不必改本文件。
      - 'docs/assets/desktop-pet/**'
      # 仓库根 .gitignore 是这份资产守卫的**规则真源**：`tests/petAssetTracking.test.cjs` 用
      # `git check-ignore --no-index` 断言 desktop-pet 的例外规则（把规则退回 `docs/` 会立刻变红）。
      # 它不在 frontend/ 下，若不写这一条，"只改 .gitignore"的提交会让那条守卫静默不执行。
      - '.gitignore'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      # 与 push 同源：资产批次变更必须过同一套桌宠门禁，PR 上不能比推送更松。
      - 'docs/assets/desktop-pet/**'
      # 同上：.gitignore 是资产守卫的规则真源，PR 里改它同样要跑这条守卫。
      - '.gitignore'

# 同一分支/PR 重复触发时，取消进行中的旧任务，避免浪费 Actions 额度
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (npm ci + 桌宠门禁/测试 + vite build)
    runs-on: ubuntu-latest
    # devDependencies 里有 electron（^44.5.1），它的 postinstall 会下载约 100MB 的平台二进制。
    # 本 job 的四件事都不需要那个二进制：
    #   gate:pet / test:pet（pet 用例没有一个 require('electron')）/ vite build /
    #   check-pet-not-shipped。跳过下载只影响二进制，electron 包本体（含 index.d.ts）照常安装，
    #   所以 vue-tsc 的类型解析不受影响。
    # ⚠️ 只在 job 级设：`npm ci` 那一步就要生效（step 级设到别的步骤上等于没设）。
    # ⚠️ release.yml 绝不能加这个变量 —— 那里要 electron-builder 打 win 安装包，跳过下载会直接炸。
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须是完整历史：tests/petAssetTracking.test.cjs 里有一条断言用
          #    `git log -1 --format=%H -- <批次路径>` 判断"该批次曾交付过、但索引整批为空"。
          #    actions/checkout 默认 fetch-depth: 1（浅克隆），历史查不到 ⇒ 那条断言会退化成
          #    一行 console 警告，守卫"看着在、其实没有"。与 release.yml 保持一致。
          #    正确性优先于 CI 耗时，不要为了省几秒改回 1 或加条件 fetch。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 桌宠门禁与测试必须进 CI（用户硬约束：本地不跑测试直接提交，CI 不能照样放行）。
      # 放在 build 之前：早失败比晚失败好，别等构建 30 秒才报测试红。
      #
      # gate:pet = 几何门禁（check-pet-geometry.mjs）+ 层门禁（check-pet-layers.mjs）。
      # 它会读母版 PNG 做 C2/C3 像素级校验，依赖 devDependency sharp
      #（sharp 已在 package.json devDependencies，npm ci 会拉 linux-x64 预编译二进制）。
      - name: 桌宠资产门禁（几何 + 层，含像素级校验）
        run: npm run gate:pet

      # test:pet = 133 个 .cjs 用例（node --test）+ 341 个 .ts 用例（tsx --test）。
      # 覆盖：探活/端口隔离、安装版门禁与产物守卫、表现层/行为、资产入库守卫（含 git 历史断言）。
      # ⚠️ 这里刻意不跑 test:pet:mutate：它会先变异源码再还原，属于自修改，且耗时约 2 分钟，
      #    定位为本地/交付验收项（由交付方每次亲跑），不放进 CI。
      - name: 桌宠单元测试（cjs + ts）
        run: npm run test:pet

      - name: Build
        run: npm run build

      # 安装版不展示桌宠（用户硬约束 #3）的 CI 侧保障：
      # 只在本机跑 gate:pet:not-shipped 不够 —— 别人一次构建就可能把桌宠入口带进安装包。
      # 这一步读的是刚构建出来的 dist，顺序必须紧跟 build 之后（否则等于用旧产物自证）。
      - name: 校验安装版不含桌宠入口
        run: node scripts/check-pet-not-shipped.mjs
