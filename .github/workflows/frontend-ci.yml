name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# 同一分支/PR 重复触发时，取消进行中的旧任务，避免浪费 Actions 额度
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (npm ci + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须是完整历史：tests/petAssetTracking.test.cjs 里有一条断言用
          #    `git log -1 --format=%H -- <批次路径>` 判断"该批次曾交付过、但索引整批为空"。
          #    actions/checkout 默认 fetch-depth: 1（浅克隆），历史查不到 ⇒ 那条断言会退化成
          #    一行 console 警告，守卫"看着在、其实没有"。与 release.yml 保持一致。
          #    正确性优先于 CI 耗时，不要为了省几秒改回 1 或加条件 fetch。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 安装版不展示桌宠（用户硬约束 #3）的 CI 侧保障：
      # 只在本机跑 gate:pet:not-shipped 不够 —— 别人一次构建就可能把桌宠入口带进安装包。
      # 这一步读的是刚构建出来的 dist，顺序必须紧跟 build 之后（否则等于用旧产物自证）。
      - name: 校验安装版不含桌宠入口
        run: node scripts/check-pet-not-shipped.mjs
