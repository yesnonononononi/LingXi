server:
  port: 8088
spring:
  profiles:
    active: dev
  application:
    name: LingXi
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${LingXi.datasource.database.url}
    username: ${LingXi.datasource.database.username}
    password: ${LingXi.datasource.database.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      # 初始化连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接等待超时时间（毫秒）
      max-wait: 60000

      # 以下是解决你报错的关键配置
      # 开启空闲连接检查
      test-while-idle: true
      # 指定探测 SQL（MySQL 专用）
      validation-query: SELECT 1
      # 建议开启借出时检查，确保拿到的连接一定是好的
      test-on-borrow: true
      # 归还时检查（可开启，但会有一定性能开销）
      test-on-return: false

      # 定期清理任务执行的间隔（毫秒），默认 60 秒
      time-between-eviction-runs-millis: 60000
      # 连接在池中保持空闲而不被回收的最小时间
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: ${LingXi.datasource.redis.host}
      port: ${LingXi.datasource.redis.port}
      password: ${LingXi.datasource.redis.password}
      timeout: ${LingXi.datasource.redis.timeout:10000}
      database: ${LingXi.datasource.redis.database:0}

