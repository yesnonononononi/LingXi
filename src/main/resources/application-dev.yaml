lingxi:
  sandbox:
    # 本机开发资源由 npm run sandbox:dev 准备，部署时可用环境变量覆盖。
    application-directory: D:/Code/LingXi/.lingxi/sandbox
    startup-timeout: 30s
    file-timeout: 30s
    node-executable: D:/Code/LingXi/frontend/build/runtime/node/node.exe
    sdk-directory: D:/Code/LingXi/frontend/build/runtime/mxc/node_modules/@microsoft/mxc-sdk
